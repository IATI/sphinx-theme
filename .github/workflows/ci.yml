name: CI
on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev requirements
        run: pip install -r requirements_dev.txt
      - name: Check black
        run: black --check .
      - name: Check isort
        run: isort --check-only iati_sphinx_theme docs
      - name: Check flake8
        run: flake8 iati_sphinx_theme docs
      - name: Check mypy
        run: mypy iati_sphinx_theme docs

  build:
    # Builds against the pinned iati-design-system, so a Dependabot bump that
    # breaks the theme or its generated assets fails here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Install dependencies
        run: npm ci
      - name: Build CSS and design-system assets
        run: npm run build
      - name: Summarise generated assets against main
        if: github.ref != 'refs/heads/main'
        run: |
          collect() {
            mkdir -p "$1"
            cp iati_sphinx_theme/_generated/brand_colors.json styles/_generated/_breakpoints.scss "$1/" 2>/dev/null || true
            sha256sum iati_sphinx_theme/static/logo-colour.svg iati_sphinx_theme/static/iati.js 2>/dev/null | sed 's#  .*/#  #' > "$1/checksums.txt" || true
          }
          collect /tmp/head
          rm -rf iati_sphinx_theme/_generated styles/_generated iati_sphinx_theme/static/logo-colour.svg iati_sphinx_theme/static/iati.js
          git checkout -q "$(git merge-base HEAD origin/main)"
          npm ci && npm run build || echo "::warning::Build of main failed; the summary is incomplete."
          collect /tmp/base
          {
            echo "## Generated design-system assets vs main"
            if diff -urN /tmp/base /tmp/head > /tmp/assets.diff; then
              echo "No changes."
            else
              echo '```diff'
              cat /tmp/assets.diff
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
