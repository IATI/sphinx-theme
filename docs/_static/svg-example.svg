<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-label="Example bar chart drawn as a vector SVG in the IATI brand colours">
  <title>Example vector SVG bar chart</title>
  <rect x="0" y="0" width="360" height="240" fill="#ffffff"/>
  <text x="20" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#155366">Example vector SVG</text>
  <!-- axes -->
  <line x1="40" y1="200" x2="340" y2="200" stroke="#121212" stroke-width="2"/>
  <line x1="40" y1="60" x2="40" y2="200" stroke="#121212" stroke-width="2"/>
  <!-- bars, in the IATI brand colours -->
  <rect x="70" y="120" width="40" height="80" fill="#DB584B"/>
  <rect x="140" y="90" width="40" height="110" fill="#155366"/>
  <rect x="210" y="140" width="40" height="60" fill="#0A9172"/>
  <rect x="280" y="70" width="40" height="130" fill="#6F3AAF"/>
  <!-- labels -->
  <text x="90" y="218" font-family="sans-serif" font-size="12" fill="#121212" text-anchor="middle">2021</text>
  <text x="160" y="218" font-family="sans-serif" font-size="12" fill="#121212" text-anchor="middle">2022</text>
  <text x="230" y="218" font-family="sans-serif" font-size="12" fill="#121212" text-anchor="middle">2023</text>
  <text x="300" y="218" font-family="sans-serif" font-size="12" fill="#121212" text-anchor="middle">2024</text>
</svg>
